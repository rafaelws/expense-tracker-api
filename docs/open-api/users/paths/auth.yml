post:
  security: []
  operationId: authenticateUser
  summary: Authenticate user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AuthBody.yml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Token.yml
    '400':
      $ref: ../../common/components/responses/BadRequestResponse.yml
    '401':
      description: Invalid e-mail or password.
    '500':
      $ref: ../../common/components/responses/InternalServerErrorResponse.yml
