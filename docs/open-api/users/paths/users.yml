post:
  security: []
  operationId: createUser
  summary: Create user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateUserBody.yml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Token.yml
    '400':
      $ref: ../../common/components/responses/BadRequestResponse.yml
    '500':
      $ref: ../../common/components/responses/InternalServerErrorResponse.yml
