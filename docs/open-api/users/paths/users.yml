post:
  security: []
  operationId: createUser
  summary: Create user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateUserBody.yml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Token.yml
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../common/components/schemas/Message.yml
    5XX:
      description: Unexpected error
