post:
  operationId: createExpense
  summary: Create a new expense
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateExpenseBody.yml
  responses:
    '201':
      description: Expense created successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Expense.yml
    '400':
      $ref: ../../common/components/responses/BadRequestResponse.yml
    '500':
      $ref: ../../common/components/responses/InternalServerErrorResponse.yml