post:
  operationId: createExpense
  summary: Create a new expense
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateExpenseBody.yml
  responses:
    '201':
      description: Expense created successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Expense.yml
    '400':
      $ref: ../../common/components/responses/BadRequestResponse.yml
    '401':
      description: Authentication required.
    '500':
      $ref: ../../common/components/responses/InternalServerErrorResponse.yml

get:
  operationId: getExpenses
  summary: Retrieve expenses
  description: Retrieve expenses based on query parameters for reference date and period.
  parameters:
    - name: ref
      in: query
      description: The reference date to start the period from.
      required: true
      schema:
        type: string
        format: date
        example: 2024-07-23
    - name: period
      in: query
      description: The period to retrieve expenses for.
      required: true
      schema:
        type: string
        enum: ["15d", "30d", "45d", "90d", "1m", "2m", "3m"]
        example: 45d
  responses:
    '200':
      description: Successfully retrieved expenses.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Expense.yml
          examples:
            expenses:
              summary: Example response with expenses
              value: [
                {
                  "id": "uuid",
                  "amount": "45.50",
                  "date": "2024-07-02T00:00:00.000Z",
                  "description": "Expensive dinner"
                },
                {
                  "id": "uuid",
                  "amount": "150.00",
                  "date": "2024-07-01T00:00:00.000Z",
                  "description": "Office supplies"
                }
              ]
    '400':
      $ref: ../../common/components/responses/BadRequestResponse.yml
    '401':
      description: Authentication required.
    '500':
      $ref: ../../common/components/responses/InternalServerErrorResponse.yml